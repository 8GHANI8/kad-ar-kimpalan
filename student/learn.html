<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Belajar — ARClass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/css/style.css">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<!-- js-aruco2: pengesan penanda ArUco (global AR / POS / CV / SVD) -->
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/cv.js"></script>
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/aruco.js"></script>
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/svd.js"></script>
<script src="https://cdn.jsdelivr.net/gh/damianofalcioni/js-aruco2@master/src/posit1.js"></script>
</head>
<body class="viewer">

<div class="viewer-wrap">
  <div id="stage"></div>
  <div id="ar-container" style="display:none;"></div>

  <div class="hud-top">
    <a class="back" href="index.html">← Senarai</a>
    <!-- Pill ini cuma papar tajuk item semasa dalam Mod AR (di mana item
         ditentukan oleh kad yang dikesan, bukan pilihan manual) - dalam Mod
         3D ia disorokkan (lihat .viewer-wrap.mode-3d .hud-top .title dalam
         style.css) sebab item-select di bawah dah papar nama yang SAMA -
         dua pill bertindan menunjukkan info berulang tanpa sebab. -->
    <div class="title" id="hud-title">Memuatkan…</div>
  </div>

  <!-- Satu pill kolaps sahaja, di bawah butang "← Senarai" - tekan untuk buka
       senarai penuh item (cuma relevan dalam Mod 3D, disorok dalam Mod AR
       sebab kad fizikal yang tentukan item, bukan pilihan manual). -->
  <div class="item-select" id="item-select">
    <button class="item-select-toggle" id="item-select-toggle" type="button">
      <span id="item-select-current">Memuatkan…</span>
      <span class="chev">▾</span>
    </button>
    <div class="item-select-menu" id="item-select-menu"></div>
  </div>

  <div class="mode-toggle">
    <button id="btn-info" title="Keterangan">i</button>
    <button id="btn-3d" class="active">3D</button>
    <button id="btn-ar">AR</button>
    <!-- Dipindah ke dalam susunan FAB ni (di bawah butang AR) supaya tak
         bertindih dengan butang ▶ MAIN/JEDA video (yang dicipta oleh
         ar-core.js di tengah-bawah skrin). Gaya bulatan merah macam ikon
         YouTube - segitiga putih di tengah. -->
    <button id="btn-youtube" class="youtube-btn" title="Video Penerangan" style="display:none;">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <div class="hud-status" id="hud-status"><span class="dot"></span><span id="hud-status-text">Sedia</span></div>

  <div class="hotspot-panel" id="hotspot-panel">
    <span class="close" id="hotspot-close">✕</span>
    <p class="hs-label">Bahagian</p>
    <h4 id="hs-title">—</h4>
    <p id="hs-info">—</p>
  </div>

  <div class="hotspot-panel item-info-panel" id="item-info-panel">
    <span class="close" id="item-info-close">✕</span>
    <p class="hs-label">Keterangan Item</p>
    <h4 id="info-title">—</h4>
    <p id="info-summary">—</p>
    <ul id="info-specs"></ul>
  </div>

  <div class="instruction-toast" id="toast-ar" style="display:none;">
    <h3>Mod AR</h3>
    <p id="toast-ar-text">Benarkan akses kamera, kemudian halakan kamera ke mana-mana kad penanda ArUco topik ini.</p>
    <button class="btn" id="toast-ar-close">Buka Kamera</button>
  </div>
</div>

<script src="../shared/js/api.js"></script>
<script src="../shared/js/models.js"></script>
<script type="module">
import { startARViewer, start3DViewer, flattenLeafItems, itemHasModel, itemHasVideo, DEFAULT_LIGHTING, mergeLighting } from "../shared/js/ar-core.js";

const params = new URLSearchParams(location.search);
const topicId = params.get("topic");
const viewerWrap = document.querySelector(".viewer-wrap");
let lightingCfg = DEFAULT_LIGHTING; // digantikan dengan tetapan admin sebaik boot() selesai tarik Settings

const hudTitle = document.getElementById("hud-title");
const hudStatusText = document.getElementById("hud-status-text");
const btn3d = document.getElementById("btn-3d");
const btnAr = document.getElementById("btn-ar");
const itemSelect = document.getElementById("item-select");
const itemSelectToggle = document.getElementById("item-select-toggle");
const itemSelectCurrent = document.getElementById("item-select-current");
const itemSelectMenu = document.getElementById("item-select-menu");
const hotspotPanel = document.getElementById("hotspot-panel");
const hsTitle = document.getElementById("hs-title");
const hsInfo = document.getElementById("hs-info");
const toastAr = document.getElementById("toast-ar");
const toastArText = document.getElementById("toast-ar-text");
const btnInfo = document.getElementById("btn-info");
const btnYoutube = document.getElementById("btn-youtube");
const infoPanel = document.getElementById("item-info-panel");
const infoTitle = document.getElementById("info-title");
const infoSummary = document.getElementById("info-summary");
const infoSpecsList = document.getElementById("info-specs");

btnYoutube.addEventListener("click", () => {
  const item = currentDisplayedItem();
  if (item && item.youtube_url) window.open(item.youtube_url, "_blank");
});

// URL YouTube PILIHAN sahaja - butang hanya nampak bila item semasa
// memang ada youtube_url diisi (tiada placeholder kosong, ikut prinsip
// "jangan papar kawalan untuk media yang tiada").
function updateYoutubeButton(item){
  btnYoutube.style.display = (item && item.youtube_url) ? "flex" : "none";
}

document.getElementById("hotspot-close").addEventListener("click", () => hotspotPanel.classList.remove("show"));
document.getElementById("item-info-close").addEventListener("click", () => {
  infoPanel.classList.remove("show");
  btnInfo.classList.remove("active");
});

let bundle = null;
let leafItems = []; // senarai RATA item/sub-item yang boleh dipaparkan (utk AR & pilihan lalai)
let currentMode = "3d";
let currentItem = null;     // item/sub-item LEAF yang sedang dipilih dalam Mod 3D
let threeSession = null;
let arSession = null;
let arCurrentItem = null; // item terkini dikesan dalam Mod AR (utk butang Keterangan)

// Skrin sempit (telefon): dua panel bertindih kalau kedua-dua terbuka
// serentak (masing-masing sehingga 300px lebar, tak muat side-by-side pada
// skrin ~400px). Skrin lebar (PC/tablet): kekal boleh buka SERENTAK macam
// sebelum ini, sebab memang cukup ruang. 700px dipilih sebagai anggaran
// munasabah "telefon vs bukan-telefon".
function isNarrowScreen(){
  return window.innerWidth < 700;
}

function showHotspot(hit){
  if (isNarrowScreen()) { infoPanel.classList.remove("show"); btnInfo.classList.remove("active"); }
  hsTitle.textContent = hit.label;
  hsInfo.textContent = hit.info;
  hotspotPanel.classList.add("show");
}

function currentDisplayedItem(){
  if (currentMode === "3d") return currentItem;
  return arCurrentItem;
}

function renderItemInfo(item){
  infoTitle.textContent = item.title;
  infoSummary.textContent = item.summary || "";
  infoSpecsList.innerHTML = "";
  (item.specs || []).forEach(s => {
    if (!s) return;
    const li = document.createElement("li");
    li.textContent = s;
    infoSpecsList.appendChild(li);
  });
}

btnInfo.addEventListener("click", () => {
  const item = currentDisplayedItem();
  if (isNarrowScreen()) hotspotPanel.classList.remove("show");
  if (!item) {
    // Mod AR, belum ada kad dikesan lagi
    infoTitle.textContent = "Belum ada item";
    infoSummary.textContent = "Halakan kamera ke kad dahulu untuk lihat keterangan item itu.";
    infoSpecsList.innerHTML = "";
    infoPanel.classList.add("show");
    btnInfo.classList.add("active");
    return;
  }
  renderItemInfo(item);
  infoPanel.classList.toggle("show");
  btnInfo.classList.toggle("active", infoPanel.classList.contains("show"));
});

// Satu butang tunggal - tekan untuk buka/tutup senarai penuh. Item DENGAN
// subItems dipaparkan sebagai label kumpulan (tak boleh klik) dengan
// anak-anaknya disenaraikan terindent di bawahnya; item TANPA subItems
// terus jadi baris yang boleh diklik. Klik mana-mana baris pilih item itu
// terus (papar model) dan tutup senarai.
function selectItem(item){
  currentItem = item;
  closeItemMenu();
  renderItemPicker();
  if (currentMode === "3d") load3D(true);
}

function openItemMenu(){ itemSelect.classList.add("open"); }
function closeItemMenu(){ itemSelect.classList.remove("open"); }
function toggleItemMenu(){ itemSelect.classList.toggle("open"); }

itemSelectToggle.addEventListener("click", (ev) => { ev.stopPropagation(); toggleItemMenu(); });
document.addEventListener("click", (ev) => {
  if (!itemSelect.contains(ev.target)) closeItemMenu();
});

function renderItemPicker(){
  itemSelectCurrent.textContent = currentItem ? currentItem.title : "Pilih item";
  itemSelectMenu.innerHTML = "";
  bundle.items.forEach((item, idx) => {
    const hasChildren = item.subItems && item.subItems.length > 0;
    if (idx > 0) itemSelectMenu.appendChild(document.createElement("div")).className = "divider";

    if (hasChildren) {
      const label = document.createElement("p");
      label.className = "group-label";
      label.textContent = item.title;
      itemSelectMenu.appendChild(label);
      item.subItems.forEach(sub => {
        const sb = document.createElement("button");
        sb.type = "button";
        sb.className = "item-row sub";
        sb.textContent = sub.title;
        if (currentItem && currentItem.item_id === sub.item_id && currentMode === "3d") sb.classList.add("active");
        sb.addEventListener("click", () => selectItem(sub));
        itemSelectMenu.appendChild(sb);
      });
    } else {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "item-row";
      b.textContent = item.title;
      if (currentItem && currentItem.item_id === item.item_id && currentMode === "3d") b.classList.add("active");
      b.addEventListener("click", () => selectItem(item));
      itemSelectMenu.appendChild(b);
    }
  });
  itemSelect.style.display = currentMode === "3d" ? "block" : "none";
}

function statusTextFor(item){
  if (itemHasModel(item)) return "Mod 3D — putar & ketik bahagian oren";
  if (itemHasVideo(item)) return "Video — tekan ▶ untuk main";
  return "Tiada model/video untuk item ini";
}

function load3D(preserveInfoPanel){
  hotspotPanel.classList.remove("show");
  if (!preserveInfoPanel) {
    infoPanel.classList.remove("show");
    btnInfo.classList.remove("active");
  }
  if (threeSession) threeSession.stop();
  if (!currentItem) return; // tiada leaf dipilih lagi (jarang berlaku - lihat boot())
  hudTitle.textContent = currentItem.title;
  hudStatusText.textContent = statusTextFor(currentItem);
  threeSession = start3DViewer(document.getElementById("stage"), currentItem, {
    onHotspotClick: showHotspot,
    lighting: lightingCfg
  });
  updateYoutubeButton(currentItem);
  if (preserveInfoPanel && infoPanel.classList.contains("show")) renderItemInfo(currentItem);
}

async function loadAR(){
  hotspotPanel.classList.remove("show");
  infoPanel.classList.remove("show");
  btnInfo.classList.remove("active");
  arCurrentItem = null;
  updateYoutubeButton(null);
  hudStatusText.textContent = "Memulakan kamera…";
  arSession = await startARViewer(document.getElementById("ar-container"), topicId, leafItems, {
    onTargetFound: (item) => {
      hudTitle.textContent = item.title;
      hudStatusText.textContent = itemHasVideo(item) && !itemHasModel(item) ? "Kad dikesan ✓ — tekan ▶ untuk main" : "Kad dikesan ✓";
      arCurrentItem = item;
      updateYoutubeButton(item);
      // kalau panel keterangan sedang terbuka, kemaskini terus ikut kad baru
      if (infoPanel.classList.contains("show")) renderItemInfo(item);
    },
    onTargetLost: () => { hudStatusText.textContent = "Cari kad…"; },
    onHotspotClick: showHotspot,
    lighting: lightingCfg,
    onError: (err) => {
      console.error(err);
      hudStatusText.textContent = "AR gagal — kembali ke Mod 3D";
      switchMode("3d");
    }
  });
  if (arSession) hudStatusText.textContent = "Cari kad…";
}

function switchMode(mode){
  if (mode === currentMode) return;
  hotspotPanel.classList.remove("show");
  if (mode === "3d") {
    if (arSession) { arSession.stop(); arSession = null; }
    document.getElementById("stage").style.display = "block";
    document.getElementById("ar-container").style.display = "none";
    btn3d.classList.add("active"); btnAr.classList.remove("active");
    toastAr.style.display = "none";
    currentMode = "3d";
    viewerWrap.classList.add("mode-3d"); viewerWrap.classList.remove("mode-ar");
    renderItemPicker();
    load3D();
  } else {
    if (threeSession) { threeSession.stop(); threeSession = null; }
    document.getElementById("stage").style.display = "none";
    document.getElementById("ar-container").style.display = "block";
    btnAr.classList.add("active"); btn3d.classList.remove("active");
    currentMode = "ar";
    viewerWrap.classList.add("mode-ar"); viewerWrap.classList.remove("mode-3d");
    renderItemPicker();
    hudTitle.textContent = "Cari sebarang kad…";
    toastAr.style.display = "block";
  }
}

btn3d.addEventListener("click", () => switchMode("3d"));
btnAr.addEventListener("click", () => switchMode("ar"));
document.getElementById("toast-ar-close").addEventListener("click", () => { toastAr.style.display = "none"; loadAR(); });

async function boot(){
  viewerWrap.classList.add("mode-3d"); // lalai Mod 3D - sorok pill tajuk berulang dari mula
  if (!topicId || !apiConfigured()){
    hudTitle.textContent = "Ralat konfigurasi";
    hudStatusText.textContent = !topicId ? "Topik tiada dalam URL" : "API belum disambung";
    return;
  }
  // Tetapan Pencahayaan (Sheet "Settings") - PILIHAN. Kalau Sheet lama belum
  // ada baris ini lagi, atau panggilan gagal, guna DEFAULT_LIGHTING senyap-
  // senyap (jangan biar seluruh halaman gagal boot sebab satu ciri kecil).
  try {
    const settingsRows = await Api.getSettings();
    lightingCfg = mergeLighting(settingsRows && settingsRows[0]);
  } catch (err) {
    lightingCfg = DEFAULT_LIGHTING;
  }
  try {
    bundle = await Api.getTopicBundle(topicId);
    leafItems = flattenLeafItems(bundle.items);
    if (!leafItems.length){
      hudTitle.textContent = bundle.topic.title;
      hudStatusText.textContent = "Tiada item dalam topik ini lagi";
      return;
    }
    document.title = bundle.topic.title;
    currentItem = leafItems[0];
    renderItemPicker();
    load3D();
  } catch (err) {
    hudTitle.textContent = "Ralat memuatkan";
    hudStatusText.textContent = err.message;
  }
}
boot();
</script>
</body>
</html>
